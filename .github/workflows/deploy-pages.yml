name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Autorisations requises par actions/deploy-pages
permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; on laisse finir celui en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (base path /RoxwoodNetworkV3/)
        env:
          # Le site est servi depuis https://poloveni.github.io/RoxwoodNetworkV3/
          BASE_PATH: /${{ github.event.repository.name }}/
          NODE_ENV: production
        run: npm run build:pages

      - name: Check build output
        run: |
          test -f .output/public/index.html || { echo "::error::index.html manquant — le pré-rendu a échoué"; exit 1; }
          test -f .output/public/site/index.html || { echo "::error::public/site non copié dans le build"; exit 1; }
          echo "Contenu publié :"
          ls -la .output/public

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Dossier réellement généré par le build (pré-rendu + assets + public/)
          path: .output/public

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
